name: Android build

# Builds the APK on every push / PR. Pushes to main also refresh the
# "latest-build" pre-release so the APK can be downloaded straight to a phone.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      # A fixed signing key (repo secret DEBUG_KEYSTORE_B64) so each build
      # installs over the previous one instead of needing an uninstall.
      - name: Restore signing key
        env:
          KS: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS" ]; then
            mkdir -p ~/.android
            echo "$KS" | base64 -d > ~/.android/debug.keystore
            echo "Using the shared debug keystore"
          else
            echo "::warning::DEBUG_KEYSTORE_B64 not set; APK is signed with a throwaway key"
          fi

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build APK
        run: ./gradlew --no-daemon assembleRelease

      - name: Name the APK
        run: |
          SHORT=$(git rev-parse --short HEAD)
          BRANCH=$(echo "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" | tr '/' '-')
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/openvw-${BRANCH}-${SHORT}.apk"
          echo "APK=android/out/openvw-${BRANCH}-${SHORT}.apk" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: openvw-apk
          path: ${{ env.APK }}

      - name: Publish latest-build pre-release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: .
        run: |
          gh release delete latest-build --yes --cleanup-tag 2>/dev/null || true
          gh release create latest-build "$APK" --prerelease --target "$GITHUB_SHA" \
            --title "Latest build ($(git rev-parse --short HEAD))" \
            --notes "Automatic build of main at ${GITHUB_SHA}. Installs over earlier builds from this fork."
